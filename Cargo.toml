[workspace]
resolver = "2"
members = ["apps/artcraft", "apps/artcraft-proxy"]
# The two reference clones (upstream ArtCraft sources) are git submodules,
# NOT part of this workspace.
exclude = ["clone"]

[workspace.package]
version = "0.41.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/artcraft"
authors = ["ArtCraft egui rebuild contributors"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true

name: build (proxy Linux+Windows · egui Windows)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proxy-linux:
    name: artcraft-proxy · linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/artcraft-proxy

      - name: Build (release)
        run: cargo build --release --locked -p artcraft-proxy --target x86_64-unknown-linux-gnu

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/artcraft-proxy dist/artcraft-proxy-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-proxy-linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  proxy-windows:
    name: artcraft-proxy · windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/artcraft-proxy

      - name: Build (release)
        run: cargo build --release --locked -p artcraft-proxy --target x86_64-pc-windows-msvc

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/artcraft-proxy.exe" \
             "dist/artcraft-proxy-windows-x86_64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-proxy-windows-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  egui-windows:
    name: artcraft (egui) · windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/artcraft

      - name: Build (release)
        run: cargo build --release --locked -p artcraft --target x86_64-pc-windows-msvc

      - name: Stage bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/artcraft.exe" "dist/artcraft-egui-windows-x64.exe"
          Compress-Archive -Path "dist/artcraft-egui-windows-x64.exe" -DestinationPath "dist/artcraft-egui-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-egui-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
